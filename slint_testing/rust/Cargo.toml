[package]
name = "slint-testing-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Compile/instantiate and the JSON value bridge are shared with the runtime
# backend; this crate adds only the testing platform and element queries.
slint-dart-interpreter = { path = "../../slint_interpreter/interpreter" }
slint = { version = "1", default-features = false, features = ["compat-1-2", "std"] }
i-slint-backend-testing = "1.17"
serde_json = "1"

[lints]
workspace = true
