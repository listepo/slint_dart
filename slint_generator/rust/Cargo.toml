[package]
name = "slint-introspect"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "slint-introspect"
path = "src/main.rs"

[dependencies]
# Must match the `slint` version the generated AOT crate pins (see
# slint_compiler/lib/src/rust_glue.dart) — the schema must describe the same
# compiler that slint-build runs.
i-slint-compiler = { version = "=1.17.1", features = ["default", "rust", "display-diagnostics", "software-renderer", "bundle-translations"] }
serde_json = "1"
spin_on = "0.1"

[lints]
workspace = true
