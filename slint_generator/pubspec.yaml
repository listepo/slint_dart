name: slint_generator
description: Shared .slint → Dart codegen — typed component wrappers that run on any Slint backend, plus the slint-introspect schema extractor.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  build: ^4.0.10
  slint: ^0.1.0
  slint_build: ^0.1.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
