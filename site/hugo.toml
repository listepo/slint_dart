baseURL = "https://example.com/slint_dart/"
title = "slint_dart"
defaultContentLanguage = "en"
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    name = "Guides"
    pageRef = "/guides"
    weight = 1
  [[menu.main]]
    name = "Packages"
    pageRef = "/packages"
    weight = 2
  [[menu.main]]
    name = "Examples"
    pageRef = "/examples"
    weight = 3
  [[menu.main]]
    name = "Contributing"
    pageRef = "/contributing"
    weight = 4
  [[menu.main]]
    name = "Search"
    weight = 5
    [menu.main.params]
      type = "search"

[params]
  description = "Slint UI toolkit ↔ Flutter integration: typed codegen, interpreter and AOT backends, headless and Patrol UI testing."

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    displayCopyright = false
    displayPoweredBy = true
