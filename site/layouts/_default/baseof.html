<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">slint_dart</a>
    <span class="site-tag">Slint ↔ Flutter</span>
    <nav>
      <a href="{{ "/" | relURL }}">Overview</a>
      <a href="{{ "packages/" | relURL }}">Packages</a>
      <a href="{{ "guides/" | relURL }}">Guides</a>
      <a href="{{ "examples/" | relURL }}">Examples</a>
      <a href="{{ "contributing/" | relURL }}">Contributing</a>
    </nav>
  </header>
  <div class="layout">
    {{ if and (not .IsHome) .Parent }}
    <aside class="sidebar">
      {{ range .Parent.Pages.ByWeight }}
      <a href="{{ .RelPermalink }}"{{ if eq .Permalink $.Permalink }} class="active"{{ end }}>{{ .Title }}</a>
      {{ end }}
    </aside>
    {{ end }}
    <main>
      {{ block "main" . }}{{ .Content }}{{ end }}
    </main>
  </div>
  <footer class="site-footer">
    <span>slint_dart docs — built with Hugo, deployed to GitHub Pages.</span>
  </footer>
</body>
</html>
