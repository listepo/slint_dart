name: todo_example
description: Todo demo — a Slint UI compiled at runtime and rendered inside Flutter via slint_native.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  slint: ^0.1.0
  slint_native: ^0.1.0
  hooks: ^2.0.0
  slint_compiler: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  build_runner: ^2.16.0

flutter:
  uses-material-design: true
  assets:
    - lib/todo.slint
