name: todo_example
description: Todo demo — a Slint UI rendered inside Flutter; interpreter (slint_interpreter) in debug, AOT-compiled (slint_compiler) in release/profile.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  slint: ^0.1.0
  slint_interpreter: ^0.1.0
  hooks: ^2.0.0
  slint_compiler: ^0.1.0

dev_dependencies:
  slint_generator: ^0.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0
  build_runner: ^2.16.0

flutter:
  uses-material-design: true
