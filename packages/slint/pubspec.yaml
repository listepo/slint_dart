name: slint
description: Core abstract render-engine API for Slint on Flutter — engine, components, render targets, input events (mirrors i-slint-core / slint-interpreter concepts).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  # slint_view_test.dart drives the widget with a fake render target.
  flutter_test:
    sdk: flutter
  # slint_core.dart is Flutter-free on purpose, so its tests run under plain
  # `dart test` — no binding, no device.
  test: ^1.25.0
