name: slint_testing
description: Test Slint UIs by querying the accessibility tree — find elements by label, id, or type, click them, and assert on properties and callbacks. Built on i-slint-backend-testing.
version: 0.0.1
license: Apache-2.0
homepage: https://github.com/listepo/slint_dart
repository: https://github.com/listepo/slint_dart/tree/main/packages/slint_testing
issue_tracker: https://github.com/listepo/slint_dart/issues
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0
  hooks: ^2.0.0
  slint_build: ^0.0.1
dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.0.0
  test: ^1.25.0
