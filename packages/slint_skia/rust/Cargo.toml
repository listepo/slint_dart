[package]
name = "slint-skia-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
slint-dart-interpreter = { path = "../../slint_interpreter/interpreter" }
slint = { workspace = true, features = ["compat-1-2", "std"] }
i-slint-renderer-skia = { workspace = true }
i-slint-core = { workspace = true }

# The skeleton does not reference the Skia crates yet (see AGENTS.md); keep
# them declared without failing `cargo machete` (melos `deps:unused`).
[package.metadata.cargo-machete]
ignored = ["slint", "i-slint-core", "i-slint-renderer-skia"]

[lints]
workspace = true
