[workspace]
resolver = "2"
members = [
    "slint/rust",
    "slint_generator/rust",
    "slint_interpreter/interpreter",
    "slint_interpreter/rust",
    "slint_skia/rust",
    "slint_testing/rust",
]

# Shared lint levels; every member opts in with `[lints] workspace = true`.
# Run as: cargo clippy --workspace --exclude slint-skia-ffi --all-targets
# (slint-skia-ffi builds all of Skia — CI-only, see slint_skia/README.md).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
