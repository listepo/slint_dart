[package]
name = "slint-compiler-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
slint-dart-core = { path = "../../slint/rust" }
slint = { version = "1", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-systemfonts"] }
serde_json = "1"

[build-dependencies]
slint-build = "1"
