name: slint_compiler
description: Compile-time Slint path for Flutter — typed components generated by slint-build, no interpreter.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  slint: ^0.1.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  ffigen: ^21.0.0

flutter:
  plugin:
    platforms:
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
