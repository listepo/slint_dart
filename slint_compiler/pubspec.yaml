name: slint_compiler
description: Compile-time Slint path for Flutter — typed components generated by slint-build, no interpreter.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  slint: ^0.1.0
  ffi: ^2.1.0
  hooks: ^2.0.0
  slint_build: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  ffigen: ^21.0.0
