name: slint_compiler
description: Generates typed Dart wrappers (*.g.dart) from .slint files, AOT-compiled via slint-build — no slint-interpreter at runtime.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  build: ^4.0.10
  code_assets: ^1.2.1
  ffi: ^2.1.0
  hooks: ^2.0.0
  slint: ^0.1.0
  slint_build: ^0.1.0
  slint_generator: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
