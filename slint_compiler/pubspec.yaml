name: slint_compiler
description: Generates typed Dart wrappers (*.g.dart) from .slint files. Pure Dart — the generated code runs on the slint_native interpreter engine.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  build: ^4.0.10
  slint: ^0.1.0
  slint_native: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
