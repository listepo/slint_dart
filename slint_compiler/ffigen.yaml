name: SlintCompilerBindings
description: Generated FFI bindings for slint-compiler-ffi. Do not edit.
output: lib/src/bindings.g.dart
ffi-native:
  asset-id: 'package:slint_compiler/src/bindings.g.dart'
functions:
  include:
    - 'slint_compiler_.*'
globals:
  exclude:
    - '.*'
macros:
  exclude:
    - '.*'
enums:
  exclude:
    - '.*'
unnamed-enums:
  exclude:
    - '.*'
headers:
  entry-points:
    - rust/include/slint_compiler_ffi.h
preamble: |
  // dart format off
  // ignore_for_file: type=lint
